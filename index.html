<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>電腦概論刷題本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: exam-sheet column (question card) + answer-card grid (畫卡) as navigator */
:root{
  --bg:#eef1f4; --paper:#ffffff; --ink:#18202b; --muted:#5d6876; --line:#d5dbe2;
  --accent:#1f4fa3; --accent-soft:#e3ebf8;
  --ok:#17804a; --ok-soft:#e1f3e8; --bad:#c2372f; --bad-soft:#fbe6e4; --mark:#b7791f;
  --display:"Noto Serif TC","Songti TC",serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161c; --paper:#1b2129; --ink:#e6eaf0; --muted:#9aa5b3; --line:#2e3742;
  --accent:#7fa6ec; --accent-soft:#223250;
  --ok:#5cc58b; --ok-soft:#173326; --bad:#f07a71; --bad-soft:#3a1f1d; --mark:#e0aa55; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --paper:#1b2129; --ink:#e6eaf0; --muted:#9aa5b3; --line:#2e3742;
  --accent:#7fa6ec; --accent-soft:#223250;
  --ok:#5cc58b; --ok-soft:#173326; --bad:#f07a71; --bad-soft:#3a1f1d; --mark:#e0aa55; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-family:var(--display);font-weight:900;font-size:clamp(1.5rem,4vw,2.1rem);margin:0;line-height:1.2;text-wrap:balance}
.sub{color:var(--muted);font-size:.85rem;letter-spacing:.04em}
.stats{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.stats b{font-family:var(--mono);color:var(--ink);font-size:1.05rem}
.stats .o b{color:var(--ok)} .stats .x b{color:var(--bad)}
.modes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.modes button,.ctl button{font:inherit;font-size:.9rem;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
.modes button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.modes button:focus-visible,.ctl button:focus-visible,.opt:focus-visible,.cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jump{display:flex;gap:6px;align-items:center;margin-left:auto;font-size:.9rem;color:var(--muted)}
.jump input{width:72px;font:inherit;font-family:var(--mono);padding:4px 8px;border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px}
.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.qno{font-family:var(--mono);font-weight:600;font-size:1.6rem;color:var(--accent)}
.qno small{font-size:.8rem;color:var(--muted);font-weight:500;margin-left:8px}
.flag{font:inherit;font-size:.85rem;background:none;border:1px solid var(--line);color:var(--muted);border-radius:6px;padding:3px 10px;cursor:pointer}
.flag[aria-pressed="true"]{color:var(--mark);border-color:var(--mark)}
.qtext{font-size:1.15rem;font-weight:500;margin:0 0 18px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.opt .n{font-family:var(--mono);font-weight:600;flex:0 0 auto;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.9rem}
.opt span:last-child{min-width:0;padding-top:2px}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.right .n{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)} .opt.wrong .n{background:var(--bad);border-color:var(--bad);color:var(--paper)}
.result{margin-top:16px;padding:12px 14px;border-radius:8px;font-weight:500}
.result.ok{background:var(--ok-soft);color:var(--ok)} .result.no{background:var(--bad-soft);color:var(--bad)}
.ctl{display:flex;justify-content:space-between;gap:8px;margin-top:20px;flex-wrap:wrap}
.ctl .primary{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.hint{font-size:.8rem;color:var(--muted);margin-top:12px}
.side h2{font-family:var(--display);font-size:1.05rem;margin:0 0 4px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line)}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px;max-height:520px;overflow-y:auto;padding:2px}
.cell{font-family:var(--mono);font-size:.72rem;padding:4px 0;text-align:center;border:1px solid var(--line);border-radius:4px;background:var(--paper);color:var(--muted);cursor:pointer}
.cell.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.cell.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.cell.cur{outline:2px solid var(--accent);color:var(--ink)}
.cell.mk{box-shadow:inset 0 -3px 0 var(--mark)}
.reset{margin-top:12px;font:inherit;font-size:.8rem;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.confirm{font-size:.85rem;margin-top:8px;color:var(--bad)} .confirm button{font:inherit;font-size:.8rem;margin-left:6px;cursor:pointer}
.empty{text-align:center;color:var(--muted);padding:40px 0}
@media (prefers-reduced-motion:no-preference){.opt{transition:background .12s,border-color .12s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="sub">電腦軟體應用 丙級學科 · 工作項目01</div>
      <h1>電腦概論刷題本</h1>
    </div>
    <div class="stats">
      <span>已作答 <b id="sDone">0</b>/334</span>
      <span class="o">答對 <b id="sOk">0</b></span>
      <span class="x">答錯 <b id="sNo">0</b></span>
      <span>正確率 <b id="sRate">–</b></span>
    </div>
  </header>

  <div class="modes" role="group" aria-label="刷題模式">
    <button id="mSeq" data-m="seq" aria-pressed="true">依序</button>
    <button id="mRand" data-m="rand" aria-pressed="false">隨機</button>
    <button id="mWrong" data-m="wrong" aria-pressed="false">錯題本</button>
    <button id="mMark" data-m="mark" aria-pressed="false">標記題</button>
    <button id="mNew" data-m="new" aria-pressed="false">未作答</button>
    <label class="jump" for="jumpIn">跳到第 <input id="jumpIn" type="number" min="1" max="334" inputmode="numeric"> 題</label>
  </div>

  <div class="grid">
    <main class="card" id="qcard"></main>
    <aside class="card side">
      <h2>答案卡</h2>
      <div class="legend"><span><i style="background:var(--ok-soft);border-color:var(--ok)"></i>答對</span><span><i style="background:var(--bad-soft);border-color:var(--bad)"></i>答錯</span><span><i style="box-shadow:inset 0 -3px 0 var(--mark)"></i>標記</span></div>
      <div class="cells" id="cells"></div>
      <button class="reset" id="resetBtn">清除所有作答紀錄</button>
      <div class="confirm" id="confirmBox" hidden>確定清除？<button id="yesReset">清除</button><button id="noReset">取消</button></div>
    </aside>
  </div>
</div>

<script>

const KEY='pc-intro-334-v1';
let st={ans:{},mark:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.ans)st=s;}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}};
let mode='seq',list=[],pos=0,shown=null;

function buildList(){
  const all=Q.map((_,i)=>i);
  if(mode==='seq')list=all;
  else if(mode==='rand'){list=all.slice();for(let i=list.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[list[i],list[j]]=[list[j],list[i]]}}
  else if(mode==='wrong')list=all.filter(i=>st.ans[Q[i][0]]&&st.ans[Q[i][0]]!==Q[i][2]);
  else if(mode==='mark')list=all.filter(i=>st.mark[Q[i][0]]);
  else list=all.filter(i=>!st.ans[Q[i][0]]);
  pos=0;
}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function render(){
  const card=document.getElementById('qcard');
  if(!list.length){
    const msg={wrong:'目前沒有答錯的題目。',mark:'還沒有標記任何題目。',new:'334 題都作答過了。'}[mode]||'沒有題目。';
    card.innerHTML=`<div class="empty">${msg}</div>`;renderCells();return;
  }
  const i=list[pos],[no,code,ans,q,opts]=Q[i];
  const picked=shown===no?st.ans[no]:null;
  card.innerHTML=`
    <div class="qhead"><div class="qno">${no}<small>題庫編號 ${esc(code)} · ${pos+1}/${list.length}</small></div>
      <button class="flag" id="flagBtn" aria-pressed="${!!st.mark[no]}">${st.mark[no]?'★ 已標記':'☆ 標記'}</button></div>
    <p class="qtext">${esc(q)}</p>
    <div class="opts">${opts.map((o,k)=>{
      let c='';if(picked){if(k+1===ans)c='right';else if(k+1===picked)c='wrong';}
      return `<button class="opt ${c}" data-k="${k+1}" ${picked?'disabled':''}><span class="n">${k+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>
    ${picked?`<div class="result ${picked===ans?'ok':'no'}">${picked===ans?'答對了！':picked<0?'':'答錯了。'}標準答案：${ans} ${esc(opts[ans-1])}</div>`:''}
    <div class="ctl"><button id="prevBtn" ${pos===0?'disabled':''}>← 上一題</button>
      ${picked?'':'<button id="showBtn">看答案</button>'}
      <button class="primary" id="nextBtn" ${pos>=list.length-1?'disabled':''}>下一題 →</button></div>
    <div class="hint">答對會自動跳下一題。鍵盤：1–4 作答，← → 換題，S 看答案，M 標記</div>`;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.getElementById('flagBtn').onclick=toggleMark;
  document.getElementById('prevBtn').onclick=()=>go(-1);
  document.getElementById('nextBtn').onclick=()=>go(1);
  const sb=document.getElementById('showBtn');if(sb)sb.onclick=reveal;
  renderCells();
}
function cur(){return list.length?Q[list[pos]]:null}
// 答對：短暫顯示綠色後自動跳下一題；答錯：停在原題，手動按下一題
let autoTimer=null;
function pick(k){const q=cur();if(!q||shown===q[0])return;st.ans[q[0]]=k;shown=q[0];save();render();stats();
  if(k===q[2]&&pos<list.length-1){const at=pos;autoTimer=setTimeout(()=>{autoTimer=null;if(pos===at)go(1)},700)}}
// 直接看答案視為答錯，會列入錯題本
function reveal(){const q=cur();if(!q||shown===q[0])return;st.ans[q[0]]=-1;shown=q[0];save();render();stats()}
function toggleMark(){const q=cur();if(!q)return;if(st.mark[q[0]])delete st.mark[q[0]];else st.mark[q[0]]=1;save();render()}
function go(d){clearTimeout(autoTimer);autoTimer=null;const n=pos+d;if(n<0||n>=list.length)return;pos=n;shown=null;render();scrollTop()}
function scrollTop(){if(window.innerWidth<820)document.getElementById('qcard').scrollIntoView({block:'start'})}
function jumpTo(no){
  let idx=list.findIndex(i=>Q[i][0]===no);
  if(idx<0){setMode('seq');idx=no-1}
  clearTimeout(autoTimer);pos=idx;shown=st.ans[no]?no:null;render();scrollTop();
}
function renderCells(){
  const q=cur(),c=document.getElementById('cells');
  c.innerHTML=Q.map(([no,,ans])=>{const a=st.ans[no];let cl='cell';
    if(a)cl+=a===ans?' ok':' no';if(st.mark[no])cl+=' mk';if(q&&q[0]===no)cl+=' cur';
    return `<button class="${cl}" data-no="${no}" aria-label="第${no}題">${no}</button>`}).join('');
}
document.getElementById('cells').onclick=e=>{const b=e.target.closest('.cell');if(b)jumpTo(+b.dataset.no)};
function stats(){
  let d=0,o=0;for(const[no,,ans]of Q){const a=st.ans[no];if(a){d++;if(a===ans)o++}}
  sDone.textContent=d;sOk.textContent=o;sNo.textContent=d-o;sRate.textContent=d?Math.round(o/d*100)+'%':'–';
}
function setMode(m){mode=m;document.querySelectorAll('.modes button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.m===m));buildList();shown=null}
document.querySelectorAll('.modes button').forEach(b=>b.onclick=()=>{setMode(b.dataset.m);render()});
document.getElementById('jumpIn').addEventListener('keydown',e=>{if(e.key==='Enter'){const n=+e.target.value;if(n>=1&&n<=334){jumpTo(n);e.target.blur()}}});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  if(/^[1-4]$/.test(e.key))pick(+e.key);
  else if(e.key==='ArrowRight'||e.key==='Enter')go(1);
  else if(e.key==='ArrowLeft')go(-1);
  else if(e.key==='s'||e.key==='S')reveal();
  else if(e.key==='m'||e.key==='M')toggleMark();
});
resetBtn.onclick=()=>confirmBox.hidden=false;
noReset.onclick=()=>confirmBox.hidden=true;
yesReset.onclick=()=>{st={ans:{},mark:{}};save();confirmBox.hidden=true;setMode(mode);render();stats()};
// 從上次停下的地方繼續（依序模式）
buildList();
const firstNew=Q.findIndex(([no])=>!st.ans[no]);
if(firstNew>0)pos=firstNew;
render();stats();
</script>
